[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kakeyalattice-mlx"
version = "0.1.0"
description = "MLX (Apple Silicon) port of the KakeyaLattice v1.5 E8 nested-lattice KV-cache codec. Bit-identical to the PyTorch reference."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "KakeyaLattice × Atomic-Chat (B2) integration" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
]

[project.optional-dependencies]
mlx = [
    "mlx>=0.18",
    "mlx-lm>=0.20",
]
parity = [
    "kakeyalattice[hf]>=1.5",
    "torch>=2.1",
]
dev = [
    "pytest>=7",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kakeyalattice_mlx*"]
